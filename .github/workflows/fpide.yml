name: fpide

# Text Mode IDE port: tv3 tests, layout, shims smoke, manual full build (linux64). The full build and the
# click-through tests of the IDE itself run in fpide-accept.yml. (The old job that diffed fpide/src with FPC
# upstream is gone: the port diverged on purpose.)
on:
  workflow_dispatch:
  push:
    paths:
      - fpide/**
      - tv/**
      - tools/build-fpide.sh
      - tools/fpide-env.sh
      - tools/need-tv.sh
      - tools/gen-shim.py
      - tools/check-fpide-layout.sh
      - tools/fpide-preflight.sh
      - .github/workflows/fpide.yml
      - .gitmodules
  pull_request:
    paths:
      - fpide/**
      - tv/**

concurrency:
  group: fpide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: tools/check-fpide-layout.sh

  tv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl python3
      - name: tv3 unit tests (memory backend)
        run: tools/tv-test.sh

  # Smoke link of the shims on tv3; the full IDE build is in fpide-accept.yml.
  preflight:
    runs-on: ubuntu-24.04
    needs: [layout, tv]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-misc fp-units-fcl fp-units-gfx python3
      - name: Local-equivalent preflight (shims + smoke)
        run: tools/fpide-preflight.sh

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-misc fp-units-fcl fp-units-gfx python3
      - name: Build fp (linux64, GDB/MI as upstream)
        run: tools/build-fpide.sh linux64 out/fpide/linux64
      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fpide-build-log
          path: out/fpide/linux64/obj/fp.log
