name: fpide

# Text Mode IDE port: tv3 tests (unit and pty, side by side), the unit tests of the IDE units, layout, shims smoke, manual full build (linux64). The full build and the
# click-through tests of the IDE itself run in fpide-accept.yml. (The old job that diffed fpide/src with FPC
# upstream is gone: the port diverged on purpose.)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - fpide/**
      - fpide/tv/**
      - fpide/tools/build-fpide.sh
      - fpide/tools/tv-test.sh
      - fpide/tools/tv-pty-test.sh
      - fpide/tools/unit-test.sh
      - fpide/tools/fpide-env.sh
      - fpide/tools/need-tv.sh
      - fpide/tools/gen-shim.py
      - fpide/tools/check-fpide-layout.sh
      - fpide/tools/fpide-preflight.sh
      - .github/workflows/fpide.yml
      - .gitmodules
  pull_request:
    paths:
      - fpide/**
      - fpide/tv/**
      - fpide/tools/build-fpide.sh
      - fpide/tools/tv-test.sh
      - fpide/tools/tv-pty-test.sh
      - fpide/tools/unit-test.sh
      - fpide/tools/fpide-env.sh
      - fpide/tools/need-tv.sh
      - fpide/tools/gen-shim.py
      - fpide/tools/check-fpide-layout.sh
      - fpide/tools/fpide-preflight.sh
      - .github/workflows/fpide.yml
      - .gitmodules

concurrency:
  group: fpide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - run: fpide/tools/check-fpide-layout.sh
      - name: paths spelled by hand (a ratchet)
        run: python3 fpide/tools/check-paths.py

  tv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl python3
      - name: tv3 unit tests
        run: fpide/tools/tv-test.sh

  tv-pty:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl python3
      - name: tv3 tests through a pty (side by side)
        run: fpide/tools/tv-pty-test.sh

  # The unit tests of the IDE units (fpide/tests/unit: the Go backend, the dlv session); they skip what needs a tool that is not installed.
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl python3
      - name: fpide unit tests
        run: fpide/tools/unit-test.sh

  pastree-refcount:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-fcl python3 git
      - name: FPC 3.2.2 source with reference tracking
        run: |
          git clone --depth 1 --branch release_3_2_2 https://github.com/fpc/FPCSource.git "$RUNNER_TEMP/fpc-source"
          test "$(git -C "$RUNNER_TEMP/fpc-source" rev-parse HEAD)" = 0d122c49534b480be9284c21bd60b53d99904346
      - name: Check source-browser reference balance
        run: |
          test "$(fpc -iV)" = 3.2.2
          FPIDE_OBJ="$RUNNER_TEMP/pastree-refcount/obj" \
          FPIDE_UNIT_OUT="$RUNNER_TEMP/pastree-refcount/bin" \
          FPIDE_EXTRA="-B -dCheckPasTreeRefCount -Fu$RUNNER_TEMP/fpc-source/packages/fcl-passrc/src" \
            fpide/tools/unit-test.sh t_fpsrcbrw

  # Smoke link of the shims on tv3 (beside the tests); the full IDE build is in fpide-accept.yml.
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-misc fp-units-fcl fp-units-gfx python3
      - name: Local-equivalent preflight (shims + smoke)
        run: fpide/tools/fpide-preflight.sh

  build:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-misc fp-units-fcl fp-units-gfx python3
      - name: Build fp (linux64, GDB/MI as upstream)
        run: fpide/tools/build-fpide.sh linux64 out/fpide/linux64
      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fpide-build-log
          path: out/fpide/linux64/obj/fp.log

  build-embedded:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: [preflight]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fp-compiler fp-units-rtl fp-units-base fp-units-misc fp-units-fcl fp-units-gfx python3
      - name: Build fp with the embedded compiler
        run: FPIDE_EMBED=1 fpide/tools/build-fpide.sh linux64 out/fpide/linux64-embed
      - name: Upload compiler log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fpide-embedded-build-log
          path: out/fpide/linux64-embed/obj/fp.log
