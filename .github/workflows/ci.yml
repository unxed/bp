name: ci

on:
  workflow_dispatch: {}
  push:
    branches: [main]
  pull_request:

# Fail fast: a stalled apt mirror once held a job for 13-18 minutes (a normal job takes under 2). tools/ci-apt.sh limits
# every apt-get run, each install step has a limit of its own (4 min), and each job one a few times its usual time.
jobs:
  # English in comments, documents and messages; every text file UTF-8.
  text-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Text policy
        run: python3 tools/text-policy.py

  # bpvet (tools/bpvet, SPEC §6): the linter for the rules the compiler cannot check. Its lint tests, and --strict over
  # its own sources, safe/, ext/ and tests/ (a finding, or a file it cannot parse, fails the job). Doc tests: the Pascal
  # examples of the documents are compiled and linted (SPEC §22.3). The typed mode
  # (SPEC §20) resolves every module with the units it uses; ppudump (fp-utils) reads the RTL for its stubs.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        timeout-minutes: 4
        run: tools/ci-apt.sh fp-compiler fp-units-fcl fp-utils
      - name: Build bpvet
        run: bash tools/bpvet/build.sh out/bpvet
      - name: Doc tests (tools/doctest.py)
        run: python3 tools/doctest.py --bpvet out/bpvet
      - name: Lint tests (tests/lint)
        run: bash tests/lint.sh out/bpvet
      - name: bpvet --strict over its own sources
        run: out/bpvet --strict tools/bpvet
      - name: bpvet --strict over tests/ (without tests/lint, whose *_bad.pas have findings by design)
        run: out/bpvet --strict -Fusafe -Fuext tests/safe tests/ext
      - name: bpvet --strict over safe/ and ext/
        run: out/bpvet --strict safe ext
      - name: Typed mode over bp.pas, safe/, ext/ and tests/ (tests/typed.sh)
        run: bash tests/typed.sh out/bpvet
      - name: tools/bp build checks before it compiles (tests/bp.sh)
        run: bash tests/bp.sh
      - name: The examples, built with tools/bp build and run (tests/examples.sh)
        run: bash tests/examples.sh
      - name: tools/bp get, vendor and build with deps.lock over local git repositories (tests/deps.sh)
        run: bash tests/deps.sh

  # Portable mode (Linux default, SPEC §18): all tests and compile checks,
  # the "binary is static, no libc" check, and runs on different distributions.
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        timeout-minutes: 4
        run: tools/ci-apt.sh fp-compiler fp-units-fcl
      - name: Tests (no compiler options; layers safe and ext, units Safe and BP; ext/fpc-utf8)
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          OUT: ${{ github.workspace }}/out
        run: bash tests/run.sh
      - name: Spike 3 of unxed/bp#108, GC roots from the stack of the goroutine (tools/spikes/gcroots)
        run: bash tools/spikes/gcroots/run.sh
      - name: Spike 2 of unxed/bp#108, the region style (tools/spikes/region)
        run: bash tools/spikes/region/run.sh
      - name: Spike 2 with SAFE_DEBUG (a use after Reset stops at once, R12)
        run: FPCOPTS=-dSAFE_DEBUG bash tools/spikes/region/run.sh
      - name: Benchmarks (report only, no thresholds; tests/bench)
        run: bash tests/bench/run.sh "$RUNNER_TEMP/bench"
      - name: Audit — static, no INTERP, no NEEDED (static-everywhere Profile S)
        run: |
          for b in safe-Safe/test_safe safe-BP/test_safe ext-BP/test_go ext-BP/test_threads safe-Safe/test_sumtype; do
            if readelf -lW "out/$b" | grep -q INTERP || readelf -dW "out/$b" | grep -q NEEDED; then
              echo "FAIL $b is dynamic"; readelf -dW "out/$b"; exit 1
            fi
            echo "ok   $b: static, no libc"
          done
      - name: Same binaries on other distributions (musl and glibc, old and new; side by side)
        env:
          CMDS: |
            docker run --rm -e LANG=C -v "$PWD/out:/t:ro" alpine:3.20 sh -c 'cd /t && ./safe-BP/test_safe >/dev/null && ./ext-BP/test_go >/dev/null && ./ext-BP/test_threads >/dev/null && ./ext-BP/test_utf8 >/dev/null && echo ok'
            docker run --rm -e LANG=C -v "$PWD/out:/t:ro" debian:12 sh -c 'cd /t && ./safe-BP/test_safe >/dev/null && ./ext-BP/test_go >/dev/null && ./ext-BP/test_threads >/dev/null && ./ext-BP/test_utf8 >/dev/null && echo ok'
            docker run --rm -e LANG=C -v "$PWD/out:/t:ro" ubuntu:16.04 sh -c 'cd /t && ./safe-BP/test_safe >/dev/null && ./ext-BP/test_go >/dev/null && ./ext-BP/test_threads >/dev/null && ./ext-BP/test_utf8 >/dev/null && echo ok'
            docker run --rm -e LANG=C -v "$PWD/out:/t:ro" centos:7 sh -c 'cd /t && ./safe-BP/test_safe >/dev/null && ./ext-BP/test_go >/dev/null && ./ext-BP/test_threads >/dev/null && ./ext-BP/test_utf8 >/dev/null && echo ok'
        run: tools/ci-par.sh

  # The HTTP server of examples/httpd against the same server in Go and in Rust (report only, no thresholds; the table
  # goes into examples/httpd/README.md). Go and rustc come with the runner.
  bench-httpd:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal and ab
        timeout-minutes: 4
        run: tools/ci-apt.sh apache2-utils fp-compiler fp-units-fcl fp-utils time
      - name: Benchmark (examples/httpd/bench/run.sh)
        run: bash examples/httpd/bench/run.sh "$RUNNER_TEMP/httpd"

  # Mode with libc (-dSAFE_LIBC, like cgo): cwstring + cthreads.
  libc:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal
        timeout-minutes: 4
        run: tools/ci-apt.sh fp-compiler fp-units-fcl
      - name: Tests with -dSAFE_LIBC
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
          FPCOPTS: -dSAFE_LIBC
          NO_COMPILE_CHECKS: 1
        run: bash tests/run.sh

  # i386 and aarch64: FPC 3.2.2 cross-compilers from the official sources, run under qemu-user
  # (i386 also natively). Checks the clone assembler in ext/bpthreads.pas on each architecture.
  cross:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal, qemu-user, cross binutils
        timeout-minutes: 4
        run: tools/ci-apt.sh fp-compiler qemu-user binutils-aarch64-linux-gnu binutils-i686-linux-gnu
      - name: Cache cross compilers
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/fpccross
          key: fpc-3.2.2-cross-i386-aarch64-v1
      - name: Build cross compilers (on cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /tmp/fpc-src.tgz https://downloads.freepascal.org/fpc/dist/3.2.2/source/fpc-3.2.2.source.tar.gz
          tar xzf /tmp/fpc-src.tgz -C /tmp
          cd /tmp/fpc-3.2.2
          make crossall crossinstall CPU_TARGET=aarch64 OS_TARGET=linux BINUTILSPREFIX=aarch64-linux-gnu- FPC=/usr/bin/fpc INSTALL_PREFIX=$HOME/fpccross > /tmp/a64.log 2>&1 || { tail -50 /tmp/a64.log; exit 1; }
          make crossall crossinstall CPU_TARGET=i386 OS_TARGET=linux BINUTILSPREFIX=i686-linux-gnu- FPC=/usr/bin/fpc INSTALL_PREFIX=$HOME/fpccross > /tmp/i386.log 2>&1 || { tail -50 /tmp/i386.log; exit 1; }
      - name: aarch64 and i386 under qemu (side by side)
        env:
          CMDS: |
            FPC=$I/ppcrossa64 FPCOPTS="-Tlinux -XPaarch64-linux-gnu- -Fu$I/units/aarch64-linux/*" RUN=qemu-aarch64 SKIP="test_ffi fpc-utf8" NO_COMPILE_CHECKS=1 LANG=C OUT=$PWD/outa64 bash tests/run.sh
            FPC=$I/ppcross386 FPCOPTS="-Tlinux -XPi686-linux-gnu- -Fu$I/units/i386-linux/*" RUN=qemu-i386 SKIP="test_ffi fpc-utf8" NO_COMPILE_CHECKS=1 LANG=C OUT=$PWD/out386 bash tests/run.sh
            FPC=$I/ppcrossa64 FPCOPTS="-Tlinux -XPaarch64-linux-gnu- -Fu$I/units/aarch64-linux/*" RUN=qemu-aarch64 OUT=$PWD/gca64 bash tools/spikes/gcroots/run.sh
            FPC=$I/ppcross386 FPCOPTS="-Tlinux -XPi686-linux-gnu- -Fu$I/units/i386-linux/*" RUN=qemu-i386 OUT=$PWD/gc386 bash tools/spikes/gcroots/run.sh
            FPC=$I/ppcrossa64 FPCOPTS="-Tlinux -XPaarch64-linux-gnu- -Fu$I/units/aarch64-linux/*" RUN=qemu-aarch64 OUT=$PWD/rga64 bash tools/spikes/region/run.sh
            FPC=$I/ppcross386 FPCOPTS="-Tlinux -XPi686-linux-gnu- -Fu$I/units/i386-linux/*" RUN=qemu-i386 OUT=$PWD/rg386 bash tools/spikes/region/run.sh
        run: |
          export I=$HOME/fpccross/lib/fpc/3.2.2
          tools/ci-par.sh
      - name: i386 natively (same binaries)
        run: |
          cd out386
          for t in safe-BP/test_safe ext-BP/test_go ext-BP/test_threads ext-BP/test_utf8; do LANG=C ./$t > /dev/null || { echo "FAIL $t"; exit 1; }; echo "ok   $t"; done

  # Windows x86_64: the FPC 3.2.2 cross-compiler for win64 (internal assembler and linker, no binutils) from the official
  # sources, the tests run under wine. The result per test is recorded in safe/SPEC.md §2.
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Free Pascal and wine
        timeout-minutes: 4
        run: tools/ci-apt.sh fp-compiler wine64 wine
      - name: Cache cross compiler
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/fpccross
          key: fpc-3.2.2-cross-win64-v1
      - name: Build cross compiler (on cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o /tmp/fpc-src.tgz https://downloads.freepascal.org/fpc/dist/3.2.2/source/fpc-3.2.2.source.tar.gz
          tar xzf /tmp/fpc-src.tgz -C /tmp
          cd /tmp/fpc-3.2.2
          make crossall crossinstall CPU_TARGET=x86_64 OS_TARGET=win64 FPC=/usr/bin/fpc INSTALL_PREFIX=$HOME/fpccross > /tmp/win64.log 2>&1 || { tail -50 /tmp/win64.log; exit 1; }
      - name: Create the wine prefix
        env:
          WINEDEBUG: -all
          WINEDLLOVERRIDES: mscoree,mshtml=
        run: |
          wine --version
          wine wineboot --init 2>/dev/null||true
          wine cmd /c ver 2>/dev/null||true
      - name: Tests under wine (no compile checks; ext/fpc-utf8 and test_ffi are Unix-only)
        env:
          WINEDEBUG: -all
          WINEDLLOVERRIDES: mscoree,mshtml=
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          I=$HOME/fpccross/lib/fpc/3.2.2
          FPC=$I/ppcrossx64 FPCOPTS="-Twin64 -Fu$I/units/x86_64-win64/*" EXE=.exe RUN=wine SKIP="test_ffi fpc-utf8" NO_COMPILE_CHECKS=1 OUT=$PWD/outwin bash tests/run.sh
      - name: The binaries are Windows executables
        run: |
          file outwin/safe-Safe/test_safe.exe outwin/ext-BP/test_threads.exe
          file outwin/ext-BP/test_go.exe | grep -q 'PE32+'
